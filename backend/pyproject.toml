[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pink-spec-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "langgraph>=0.1.0",
  "chromadb>=0.5.0",
  "langchain-chroma>=0.1.0",
  "rank-bm25>=0.2.2",
  "psutil>=6.0.0",
  "aiosqlite>=0.20.0",
  "sqlmodel>=0.0.19",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.1.0",
  "anyio>=4.4.0",
]

[project.optional-dependencies]
gpu = ["pynvml>=11.5.0"]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "bandit>=1.7.9",
  "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # FastAPI Depends(); long LLM prompts

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]
